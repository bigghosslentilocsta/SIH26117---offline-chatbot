version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: mrpl-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mrpl_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mrpl-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/api/generate}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
    depends_on:
      - ollama:
          condition: service_healthy
    networks:
      - mrpl_net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: mrpl-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - mrpl_net
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  mrpl_net:
    driver: bridge